version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laravel_public_api_postgres
    restart: always
    environment:
      POSTGRES_DB: public_api_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: '123456'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
